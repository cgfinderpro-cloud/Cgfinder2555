name: Build & Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean stale Gradle and build files
        run: |
          rm -rf .gradle build app/build

      - name: Configure Android SDK Path
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          elif [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Gradle Wrapper Jar exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing, downloading official Gradle 8.7 wrapper..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Keystore for Release Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using Release Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 secret not set! Creating a temporary custom Release Keystore so assembleRelease builds successfully..."
            keytool -genkeypair -v -keystore release.keystore -alias smartscanner -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "androidrelease123" -keypass "androidrelease123" \
              -dname "CN=SmartScanner, OU=Release, O=SmartScanner, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=androidrelease123" >> $GITHUB_ENV
            echo "KEY_ALIAS=smartscanner" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidrelease123" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove Keystore after build
        if: always()
        run: |
          rm -f release.keystore

      - name: Verify Release APK exists
        run: |
          echo "Listing release APK directory:"
          ls -la app/build/outputs/apk/release/
          # Ensure file is named app-release.apk if needed
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ] && [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
