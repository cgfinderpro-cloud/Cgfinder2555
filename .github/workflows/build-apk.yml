name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ensure Executable Gradle Wrapper
        run: |
          # Convert CRLF to LF in case of Windows line endings
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew

          # If gradle-wrapper.jar is missing, download official Gradle 8.7 wrapper jar
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Restoring gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sSL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle-tmp.zip
            unzip -q -j gradle-tmp.zip "gradle-8.7/lib/plugins/gradle-wrapper-8.7.jar" -d gradle/wrapper/ || true
            if [ -f "gradle/wrapper/gradle-wrapper-8.7.jar" ]; then
              mv gradle/wrapper/gradle-wrapper-8.7.jar gradle/wrapper/gradle-wrapper.jar
            fi
            rm -f gradle-tmp.zip
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartScanner-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

